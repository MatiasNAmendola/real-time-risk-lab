<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Proceso producto / arquitectura — canvas preview</title>
  <style>
    :root {
      --navy: #111e7b;
      --bg: #f7f7f7;
      --panel: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }
    .toolbar {
      position: fixed;
      z-index: 20;
      left: 16px;
      top: 16px;
      right: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
      backdrop-filter: blur(8px);
    }
    .toolbar strong { margin-right: 8px; }
    .toolbar span { color: var(--muted); font-size: 13px; }
    a.button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 32px;
      padding: 6px 10px;
      border-radius: 9px;
      background: var(--navy);
      color: #fff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 800;
    }
    a.button.secondary {
      background: #eef2ff;
      color: var(--navy);
      border: 1px solid #c7d2fe;
    }
    .viewport {
      width: 100vw;
      height: 100vh;
      overflow: auto;
      padding: 84px 16px 16px;
      -webkit-overflow-scrolling: touch;
    }
    object, img {
      display: block;
      width: 5873px;
      height: 1274px;
      max-width: none;
      background: white;
      box-shadow: 0 18px 48px rgba(0,0,0,.08);
      border: 1px solid var(--border);
    }
    .fallback {
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
    }
    @media print {
      body { overflow: visible; background: #fff; }
      .toolbar { display: none; }
      .viewport { width: auto; height: auto; overflow: visible; padding: 0; }
      object, img { box-shadow: none; border: 0; }
    }
  </style>
</head>
<body>
  <nav class="toolbar" aria-label="Acciones del canvas">
    <strong>Canvas preview</strong>
    <span>El archivo editable es Excalidraw; este HTML muestra su export SVG en tamaño real.</span>
    <a class="button" href="product-architecture-process-map.excalidraw" download>Descargar .excalidraw</a>
    <a class="button secondary" href="product-architecture-process-map.svg" target="_blank" rel="noreferrer">Abrir SVG</a>
    <a class="button secondary" href="https://excalidraw.com/" target="_blank" rel="noreferrer">Abrir Excalidraw</a>
  </nav>
  <main class="viewport" aria-label="Vista desplazable del canvas">
    <object type="image/svg+xml" data="product-architecture-process-map.svg" aria-label="Mapa de proceso producto arquitectura exportado desde Excalidraw">
      <img src="product-architecture-process-map.svg" alt="Mapa de proceso producto arquitectura exportado desde Excalidraw" />
    </object>
    <p class="fallback">Para editarlo: descargá el archivo <code>.excalidraw</code> e importalo en Excalidraw.</p>
  </main>
</body>
</html>
